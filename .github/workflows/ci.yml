name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: Test +${{ matrix.rust }} ${{ matrix.target.triple }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - triple: aarch64-unknown-linux-gnu
            feature: neon
          - triple: i686-unknown-linux-gnu
            feature: avx2
          - triple: x86_64-unknown-linux-gnu
            feature: avx2
          - triple: wasm32-wasip1
            feature: simd128
        rust: [nightly, stable, 1.85]
        exclude:
          # https://github.com/rust-lang/rust/issues/131031
          - target:
              triple: wasm32-wasip1
              feature: simd128
            rust: nightly
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target.triple }}
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target.triple }}

      - name: Enable type layout randomization
        run: echo RUSTFLAGS=${RUSTFLAGS}\ -Zrandomize-layout >> $GITHUB_ENV
        if: matrix.rust == 'nightly'

      - name: Enable target feature
        run: |
          echo RUSTFLAGS_BAK=$RUSTFLAGS >> $GITHUB_ENV
          echo RUSTFLAGS=${RUSTFLAGS}\ -Ctarget-feature=+${{ matrix.target.feature }} >> $GITHUB_ENV

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --features serde
      - run: cargo build --no-default-features --features serde
      - run: cargo test --features serde
      - run: cargo test --no-default-features --features serde
      - run: cargo test --no-default-features --features serde,force-generic
      - run: cargo test --no-default-features --features serde,nightly,portable-simd
        if: matrix.rust == 'nightly'
      - run: cargo bench --no-run

      # `-Ctarget-feature=-neon` is a hard error on aarch64 since it changes the ABI.
      - name: Disable target feature
        run: echo RUSTFLAGS=${RUSTFLAGS_BAK}\ -Ctarget-feature=-${{ matrix.target.feature }} >> $GITHUB_ENV
        if: matrix.target.triple != 'aarch64-unknown-linux-gnu'

      - run: cargo build --features serde
        if: matrix.target.triple != 'aarch64-unknown-linux-gnu'
      - run: cargo build --no-default-features --features serde
        if: matrix.target.triple != 'aarch64-unknown-linux-gnu'
      - run: cargo test --features serde
        if: matrix.target.triple != 'aarch64-unknown-linux-gnu'
      - run: cargo test --no-default-features --features serde
        if: matrix.target.triple != 'aarch64-unknown-linux-gnu'
      - run: cargo test --no-default-features --features serde,force-generic
        if: matrix.target.triple != 'aarch64-unknown-linux-gnu'
      - run: cargo test --no-default-features --features serde,nightly,portable-simd
        if: matrix.target.triple != 'aarch64-unknown-linux-gnu' && matrix.rust == 'nightly'
      - run: cargo bench --no-run
        if: matrix.target.triple != 'aarch64-unknown-linux-gnu'

  miri:
    name: Miri
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
        flags: ["", -Fforce-generic]
        include:
          # Miri only sees compile-time target features, so enable AVX2 to run the x86 SIMD kernels.
          # `-Fstd` is a no-op that keeps this entry distinct from the plain x86_64 combination.
          - target: x86_64-unknown-linux-gnu
            flags: -Fstd
            rustflags: -Ctarget-feature=+avx2
          # Big-endian.
          - target: s390x-unknown-linux-gnu
          # Big-endian with the SIMD helpers, which the generic backend does not use.
          - target: s390x-unknown-linux-gnu
            flags: -Fnightly,portable-simd
    env:
      MIRIFLAGS: -Zmiri-strict-provenance
      RUSTFLAGS: -Dwarnings ${{ matrix.rustflags }}
      RUSTDOCFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@miri
        with:
          target: ${{ matrix.target }}
      - run: cargo miri test --features serde --target ${{ matrix.target }} ${{ matrix.flags }}

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: dtolnay/install@cargo-fuzz
      - uses: Swatinem/rust-cache@v2
      - run: cargo fuzz check

  feature-checks:
    name: feature checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      - name: cargo hack
        run: cargo hack check --feature-powerset --depth 2 --all-targets

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --features serde

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-docs
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --all-features --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "--cfg docsrs -D warnings"

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all --check
